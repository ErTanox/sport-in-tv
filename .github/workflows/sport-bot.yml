name: Sport in TV

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 11-22 * * *"
  push:
    paths:
      - "extra.json"
      - "sport_bot.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sport-in-tv
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Genera pagina e calendari
        run: python sport_bot.py --giorni 7
      - name: Pubblica
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && exit 0
          git commit -m "Aggiorna eventi"
          git pull --rebase
          git push
